<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Freepik Magazine</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      color: #1a1a1a;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 32px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .tabs {
      display: flex;
      gap: 2px;
      padding: 24px 0 0;
      border-bottom: 1px solid #e9e9e9;
    }

    .tab {
      background: none;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: #999;
      padding: 8px 14px;
      cursor: pointer;
      position: relative;
      transition: color 0.15s;
    }

    .tab:hover { color: #1a1a1a; }

    .tab.active {
      color: #1a1a1a;
      font-weight: 500;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: #1a1a1a;
      border-radius: 2px 2px 0 0;
    }

    .viewer-area {
      padding: 20px 0 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 80vh;
      border: 1px solid #e9e9e9;
      border-radius: 8px;
      overflow: hidden;
      background: #fafafa;
    }

    .iframe-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
